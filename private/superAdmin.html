    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --warning: #f72585;
            --danger: #e63946;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --sidebar-width: 250px;
            --header-height: 60px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fb;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--secondary) 0%, var(--primary) 100%);
            color: white;
            height: 100vh;
            position: fixed;
            transition: var(--transition);
            z-index: 1000;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            width: 156px;
            height: auto;
        }

        .sidebar-menu {
            padding: 20px 0;
        }

        .menu-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            border-left: 4px solid transparent;
        }

        .menu-item:hover,
        .menu-item.active {
            background-color: rgba(255, 255, 255, 0.1);
            border-left-color: var(--success);
        }

        .menu-item i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .menu-item span {
            flex: 1;
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: var(--transition);
        }

        .header {
            height: var(--header-height);
            background-color: white;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .toggle-sidebar {
            font-size: 20px;
            cursor: pointer;
            display: none;
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            position: relative;
            margin: 0 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border: 1px solid #ddd;
            border-radius: 30px;
            outline: none;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .search-bar i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .user-menu {
            display: flex;
            align-items: center;
        }

        .notification,
        .messages {
            position: relative;
            margin-right: 20px;
            cursor: pointer;
        }

        .notification i,
        .messages i {
            font-size: 18px;
            color: var(--gray);
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: var(--warning);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }

        .user-avatar.user-avatar-image {
            object-fit: cover;
            padding: 0;
            border: 2px solid rgba(67, 97, 238, 0.18);
            background: rgba(67, 97, 238, 0.08);
        }

        .user-profile span {
            font-size: 14px;
            font-weight: 500;
        }

        /* Content Container */
        .content {
            padding: 20px;
        }

        /* Loader */
        /* .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 18px;
            color: var(--gray);
        } */

        /* Common Elements Used Across Pages */
        .page-title {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }

            .toggle-sidebar {
                display: block;
            }

            .user-profile span {
                display: none;
            }
        }

        :root {
            --base_scale: 5vh;
            --floor: 15vh;
            --color: #836ee5;
        }

        *,
        *:before,
        *:after {
            box-sizing: border-box;
        }

        .loader {
            background: #eee;
            min-height: 100vh;
            width: 100%;
            padding-bottom: var(--floor);
            border-bottom: var(--floor) solid #fff;
            overflow-y: hidden;
            position: fixed;
            z-index: 1050;
            display: none;
        }

        .shape {
            position: absolute;
            display: block;
            left: 50%;
            bottom: 0;
            margin-left: calc(-1 * (var(--base_scale) / 2));
            margin-bottom: var(--floor);
        }

        .shape.circle {
            width: var(--base_scale);
            height: var(--base_scale);
            background: var(--color);
            border-radius: 50%;
        }

        .shape.semi-circle {
            height: calc(var(--base_scale) * 2);
            width: var(--base_scale);
            background: var(--color);
            border-bottom-right-radius: calc(var(--base_scale) * 2);
            border-top-right-radius: calc(var(--base_scale) * 2);
        }

        .shape.square {
            width: var(--base_scale);
            height: var(--base_scale);
            background: var(--color);
        }

        .shape.rectangle {
            width: calc(var(--base_scale) * 1.5);
            height: var(--base_scale);
            background: var(--color);
        }

        .shape.triangle {
            width: 0;
            height: 0;
            border-bottom: var(--base_scale) solid var(--color);
            border-right: var(--base_scale) solid transparent;
        }

        .shape.triangle-2 {
            width: 0;
            height: 0;
            border-top: var(--base_scale) solid var(--color);
            border-left: var(--base_scale) solid transparent;
        }

        .shape.bounce-up {
            --bounce-variance: 0vh;
            --bounce-height: calc(-1 * 50vh - calc(var(--base_scale) - var(--floor) + var(--bounce-variance)));
            transition: transform 400ms cubic-bezier(0.215, 0.61, 0.355, 1);
            transform: translateY(var(--bounce-height)) rotate(0deg);
        }

        .shape.bounce-down {
            transition: transform 300ms cubic-bezier(0.6, 0.04, 0.98, 0.335);
            transform: translateY(0) rotate(var(--rotation));
        }

        .main-content {
            padding: 0px;
        }

        .modal {
            position: fixed;
            top: 15%;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            display: none;
            overflow: hidden;
            outline: 0;
            height: 70vh;
        }
    </style>
</head>
