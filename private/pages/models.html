<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabFlow Admin | Model Management</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <style>
        /* Model Management Specific Styles */
.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.page-title {
    font-size: 24px;
    font-weight: 600;
}

.primary-btn {
    background-color: #4361ee;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 10px 15px;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.primary-btn:hover {
    background-color: #3f37c9;
}

.filter-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
}

.search-box {
    flex: 1;
    max-width: 400px;
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 10px 15px 10px 40px;
    border: 1px solid #ddd;
    border-radius: 4px;
    outline: none;
    transition: all 0.3s ease;
}

.search-box input:focus {
    border-color: #4361ee;
    box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
}

.search-box i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #6c757d;
}

.filter-options {
    display: flex;
    gap: 10px;
}

.filter-select {
    padding: 8px 30px 8px 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    outline: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px;
    transition: all 0.3s ease;
}

.filter-select:focus {
    border-color: #4361ee;
    box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
}

.model-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

.model-card {
    background-color: white;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    transition: all 0.3s ease;
}

.model-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
}

.model-header {
    padding: 15px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.model-name {
    font-weight: 600;
    font-size: 18px;
    margin: 0;
}

.model-layer {
    background-color: #4895ef;
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
}

.model-content {
    padding: 15px;
}

.model-detail {
    margin-bottom: 10px;
    display: flex;
}

.detail-label {
    width: 80px;
    color: #6c757d;
    font-size: 14px;
}

.detail-value {
    font-weight: 500;
    flex: 1;
}

.status-active {
    color: #4cc9f0;
}

.status-inactive {
    color: #6c757d;
}

.model-actions {
    padding: 15px;
    display: flex;
    justify-content: space-between;
    border-top: 1px solid #eee;
}

.model-btn {
    padding: 8px 15px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 5px;
}

.btn-edit {
    background-color: #4895ef;
    color: white;
}

.btn-edit:hover {
    background-color: #4361ee;
}

.btn-delete {
    background-color: #f8d7da;
    color: #e63946;
}

.btn-delete:hover {
    background-color: #e63946;
    color: white;
}

/* Modal Styles */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.modal {
    background-color: white;
    border-radius: 8px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}

.modal-header {
    padding: 15px 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-title {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
}

.close-modal {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #6c757d;
    transition: all 0.3s ease;
}

.close-modal:hover {
    color: #e63946;
}

.modal-body {
    padding: 20px;
}

.form-row {
    margin-bottom: 20px;
}

.form-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
}

.form-input,
.form-select,
.form-textarea {
    width: 100%;
    padding: 10px 15px;
    border: 1px solid #ddd;
    border-radius: 4px;
    outline: none;
    transition: all 0.3s ease;
}

.form-textarea {
    resize: vertical;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
    border-color: #4361ee;
    box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
}

.form-select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 10px;
}

.form-btn {
    padding: 10px 20px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
}

.btn-cancel {
    background-color: #f8f9fa;
    color: #6c757d;
}

.btn-cancel:hover {
    background-color: #e9ecef;
}

.btn-save {
    background-color: #4361ee;
    color: white;
}

.btn-save:hover {
    background-color: #3f37c9;
}
.popup-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex; justify-content: center; align-items: center;
    z-index: 9999;
}
.model-detail-modal {
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 400px;
    max-height: 80%;
    overflow-y: auto;
}
.model-detail-modal h2 {
    margin-top: 0;
}


/* Responsive Styles */
@media (max-width: 768px) {
    .filter-section {
        flex-direction: column;
        align-items: stretch;
    }
    
    .search-box {
        max-width: 100%;
    }
    
    .model-cards {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>
<body>
    <div class="content">
        <div class="page-title">
            <h1>Model Management</h1>
            <p>Manage your 4-layer model system</p>
        </div>
        
       <div class="model-cards" id="modelContainer">
    <!-- Model cards will be inserted here dynamically -->
</div>

        
        <div id="addModelButton" class="add-model-btn">
            <i class="fas fa-plus"></i>
        </div>
    </div>
    
    <!-- Modal for adding/editing model -->
    <div class="modal-overlay" id="modelModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Add New Model</h3>
                <button class="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="modelForm">
                    <div class="form-row">
                        <label class="form-label">Model Name</label>
                       <input type="text" class="form-input" id="modelName">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Layer Type</label>
                        <select class="form-select" id="modelLayer">
                            <option value="1">1-Layer</option>
                            <option value="2">2-Layer</option>
                            <option value="3">3-Layer</option>
                            <option value="4">4-Layer</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label class="form-label">Price (monthly)</label>
                        <input type="text" class="form-input" id="modelPrice">
                    </div>
                    <div class="form-row">
                        <label class="form-label">Duration (days)</label>
                        <select class="form-input" id="modelDuration">
                             <option value="month">Monthly 30 days</option>
                            <option value="Quaterly">Quaterly 6 Month</option>
                            <option value="Annualy">Annualy 1 Year</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label class="form-label">Availability</label>
                       <select class="form-select" id="modelStatus">
                            <option value="available">Available</option>
                            <option value="limited">Limited</option>
                            <option value="exclusive">Exclusive</option>
                            <option value="unavailable">Unavailable</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="form-btn btn-cancel">Cancel</button>
                        <button type="submit" class="form-btn btn-save">Save Model</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
    <script src="model-management.js"></script>
</body>
</html>
