<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player with Search</title>
    <link rel="stylesheet" href="/css/tailwind-offline.css">
<style>
        .video-container:hover .play-icon {
            opacity: 1;
        }

        .video-placeholder {
            background-image: linear-gradient(45deg, #f3f4f6 25%, #e5e7eb 25%, #e5e7eb 50%, #f3f4f6 50%, #f3f4f6 75%, #e5e7eb 75%, #e5e7eb 100%);
            background-size: 56.57px 56.57px;
        }

        .modal-body input {
            width: 100%;
            padding: 5px;
            margin: 10px;
        }

        #videoModal {
            z-index: 110000;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header Section -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Video Gallery</h1>
            <div class="flex flex-col md:flex-row gap-4">
                <!-- Search Input -->
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" id="searchInput"
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Search videos...">
                </div>
                <button id="searchBtn"
                    class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-200">
                    Search
                </button>
            </div>
        </header>

        <!-- Videos Grid -->
        <div id="videosContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Videos will be loaded here dynamically -->
        </div>
        <div id="noResults" class="hidden text-center py-10">
            <p class="text-xl text-gray-500 mb-4">No videos found matching your search.</p>
            <button id="resetSearch" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Reset
                Search</button>
        </div>

        <!-- Selected Video Modal -->
        <div id="videoModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden">
            <div class="relative w-full max-w-4xl mx-4">
                <button id="closeModal" class="absolute -top-10 right-0 text-white hover:text-gray-300">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
                <div class="bg-black">
                    <iframe id="modalVideo" width="100%" height="400" src=""
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
                <h2 id="modalTitle" class="text-white text-xl mt-2"></h2>
            </div>
        </div>
    </div>
    <script src="addvideo.js"></script>
</body>

</html>
