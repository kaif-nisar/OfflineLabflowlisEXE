<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - LabFlow</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .dashboard-container {
      max-width: 1200px;
      margin: auto;
      padding: 10px;
    }

    .breadcrumb {
      color: #555;
      margin-bottom: 10px;
    }

    .alert-box,
    .helpdesk,
    .booking-table,
    .info-box {
      background: white;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.1);
      overflow: auto;

    }
    .helpdesk h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #333;
      font-family: cursive;
      font-weight: bold;
    }

    .order-now {
      color: red;
      font-weight: bold;
      text-decoration: none;
    }

    .info-box {
      background: #2c5a91;
      color: white;
      font-family: cursive;
    }

    .info-box h1 {
      margin: 0 0 10px 0;
      font-weight: bold;
      font-size: large;
    }

    .highlight {
      color: yellow;
      font-weight: bold;
    }

    .stats-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .stat {
      flex: 1 1 calc(25% - 10px);
      min-width: 140px;
      min-height: 230px;
      padding: 25px;
      text-align: center;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      color: whitesmoke;
    }



    .upper-div,
    .pending-upper,
    .complete-upper {
      text-align: start;
      font-size: large;
      font-weight: bold;
      font-family: sans-serif;
    }

    .upper-div i,
    .pending-upper i,
    .complete-upper i {
      font-size: 2rem;
      margin-bottom: 10px;
      color: white
    }

    .entity-div {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
    }

    .big-circle {
      width: 175px;
      height: 175px;
      border-radius: 50%;
      background: rgb(255 255 255 / 30%);
      position: absolute;
      right: -23px;
      top: 76px;
    }

    .small-circle {
      width: 175px;
      height: 175px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.315);
      position: absolute;
      top: -34px;
      right: -83px;
    }

    .balance {
      background-image: linear-gradient(to right, #c693f8, #a85ff4);
    }

    .Pending {
      background-image: linear-gradient(to right, #6aa4e3, #6564e7);
    }

    .Complete {
      background-image: linear-gradient(to right, #fdb786, #fe8a93);
    }

    .dis {
      position: relative;
      width: 100%;
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
    }

    .Balance {
      font-size: 2rem;
      font-weight: bold;
    }
    .pending, .complete {
      font-size: 2rem;
      font-weight: bold;
    }

    .label {
      font-size: 1.25rem;
      font-family: revert;
    }

    .helpdesk ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .helpdesk li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0;
    }
    .h2-div {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .support-number {
      background: #28a745;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }

    .booking-table table {
      width: 100%;
      border-collapse: collapse;
    }

    .booking-table th,
    .booking-table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      font-size: 0.95rem;
    }

    .booking-table th {
      background-color: #f2f2f2;
    }

    .target-progress {
      background: white;
      padding: 20px;
      border-radius: 5px;
      margin-bottom: 15px;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.1);
    }

    .target-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .target-header h3 {
      margin: 0;
      color: #333;
      font-size: 1.1rem;
    }

    .target-header i {
      color: #2c5a91;
      margin-right: 8px;
    }

    #target-month {
      color: #666;
      font-size: 0.9rem;
    }

    .target-bar {
      background: #f0f0f0;
      border-radius: 10px;
      height: 25px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(to right, #2c5a91, #4c8ed7);
      width: 0%;
      transition: width 0.5s ease-in-out;
      position: relative;
    }

    .progress-text {
      position: absolute;
      right: 10px;
      color: white;
      font-size: 0.9rem;
      line-height: 25px;
    }

    .target-details {
      display: flex;
      justify-content: space-between;
      color: #666;
      font-size: 0.9rem;
    }

    .slider-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 5px;
      margin: 10px 0;
    }

    .slider {
      display: flex;
      transition: transform 0.5s ease-in-out;
      height: 400px;
    }

    .slide {
      min-width: 100%;
      position: relative;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .slide-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .slide-content h2 {
      font-size: 1.8rem;
      margin: 0 0 5px;
    }

    .slide-content p {
      font-size: 1rem;
    }

    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.3);
      color: #555;
      border: none;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    .btn-prev {
      left: 10px;
    }

    .btn-next {
      right: 10px;
    }

    .dots-container {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
    }

    .dot.active {
      background: white;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .stat {
        flex: 1 1 calc(50% - 10px);
      }
    }

    @media (max-width: 600px) {
      .stat {
        flex: 1 1 100%;
      }

      .slider {
        height: 300px;
      }

      .slide-content h2 {
        font-size: 1.3rem;
      }

      .slide-content p {
        font-size: 0.85rem;
      }

      .btn {
        width: 35px;
        height: 35px;
        font-size: 1rem;
      }

      .booking-table table,
      .booking-table th,
      .booking-table td {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>
  <div class="dashboard-container">
    <div class="slider-container">
      <div class="slider" id="slider">
        <!-- Slides injected by JavaScript -->
      </div>
      <button class="btn btn-prev" id="prevBtn">&#10094;</button>
      <button class="btn btn-next" id="nextBtn">&#10095;</button>
      <div class="dots-container" id="dotsContainer"></div>
    </div>

    <div class="info-box">
      <h1>Welcome to <span id="admin-username"></span></h1>
      <p>Your trusted partner in occupational health services. <span class="highlight">Book your tests now!</span></p>
    </div>

    <div class="target-progress">
      <div class="target-header">
        <h3><i class="fa-solid fa-bullseye"></i> Monthly Target Progress</h3>
        <span id="target-month"></span>
      </div>
      <div class="target-bar">
        <div class="progress-bar" id="target-progress-bar">
          <span class="progress-text" id="target-progress-text">0%</span>
        </div>
      </div>
      <div class="target-details">
        <span>Target: ₹<span id="target-amount">0</span></span>
        <span>Achieved: ₹<span id="target-achieved">0</span></span>
      </div>
    </div>

    <div class="stats-container">
      <div class="stat balance">
        <div class="entity-div">
          <div class="big-circle"></div>
          <div class="small-circle"></div>
        </div>
        <div class="upper-div">
          <i class="fa-solid fa-money-bill"></i>
          <p class="label">Available Balance</p>
          <p class="Balance" id="Balance">₹0.00</p>
        </div>
      </div>
      <div class="stat Pending">
        <div class="entity-div">
          <div class="big-circle"></div>
          <div class="small-circle"></div>
        </div>
        <div class="pending-upper">
          <i class="fa-solid fa-hourglass-end"></i>
          <p class="label">Pending</p>
          <p class="pending">0</p>
        </div>
      </div>
      <div class="stat Complete">
        <div class="entity-div">
          <div class="big-circle"></div>
          <div class="small-circle"></div>
        </div>
        <div class="complete-upper">
          <i class="fa-solid fa-flag"></i>
          <p class="label">Complete</p>
          <p class="complete">0</p>
        </div>
      </div>
    </div>

    <div class="helpdesk">
      <div class="h2-div"><i class="fa-solid fa-headset"></i><h2>HELP DESK SUPPORT</h2></div>
      <ul id="helpdesk-list">
        <li><span></span><button class="support-number"></button></li>
      </ul>
    </div>

    <div class="booking-table">
      <h3><i class="fa-solid fa-address-book"></i> Today's Bookings</h3>
      <table>
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Patient Name</th>
            <th>Test</th>
            <th>Time</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="dashboard_copy.js"></script>
</body>
</html>
