<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Download Reports</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/tailwind-offline.css">
</head>

<body class="font-sans bg-blue-50 m-0 p-0">
    <div class="container w-[90%] mx-auto my-5">
        <!-- Header -->
        <div class="header text-2xl font-bold mb-5">
            Download Reports
        </div>

        <!-- Breadcrumb -->
        <div class="breadcrumb text-sm text-gray-600 mb-5 flex flex-wrap items-center gap-1">
            <a href="#" class="text-gray-500 text-base no-underline hover:underline flex items-center gap-1">
                <i class="fas fa-home"></i>
                Dashboard
            </a>
            <i class="fas fa-chevron-right"></i>
            <span>Download Report</span>
        </div>

        <!-- Search bar -->
        <div class="search-bar flex flex-col md:flex-row md:items-center md:justify-between w-full my-10 gap-3">

            <!-- Start Date -->
            <div
                class="search-start flex items-center bg-white border border-gray-400 rounded w-full md:w-[23%] h-auto">
                <p class="sd-text font-semibold text-base bg-gray-600 text-white px-3 py-2 flex items-center">
                    Date
                </p>
                <input id="start-date" type="date"
                    class="appearance-auto text-sm text-gray-700 border-0 w-full focus:outline-none p-2">
            </div>


            <!-- End Date -->
            <div
                class="search-start flex items-center bg-white border border-gray-400 rounded w-full md:w-[23%] h-auto">
                <p class="sd-text font-semibold text-base bg-gray-600 text-white px-3 py-2 flex items-center">
                    Date
                </p>
                <input id="end-date" type="date"
                    class="appearance-auto text-sm text-gray-700 border-0 w-full focus:outline-none p-2">
            </div>


            <!-- Franchisee Select -->
            <div class="search-start flex items-center bg-white border border-gray-400 rounded w-full md:w-[23%] h-10">
                <select id="franchisee-select"
                    class="franchisee-select border-0 w-full h-full text-sm text-gray-700 focus:outline-none px-2">
                    <option>-- Self --</option>
                </select>
            </div>

            <!-- Myselect -->
            <div class="search-start flex items-center bg-white border border-gray-400 rounded w-full md:w-[23%] h-10">
                <select id="myselect" class="border-0 w-full h-full text-sm text-gray-700 focus:outline-none px-2">
                    <option value="without">without letter pad</option>
                    <option value="with">with letter pad</option>
                </select>
            </div>

            <!-- Search Button -->
            <button id="search-button"
                class="h-10 bg-pink-500 text-white w-full md:w-auto px-4 rounded hover:bg-pink-600 flex items-center justify-center gap-2">
                <i class="fas fa-search"></i> Search
            </button>
        </div>

        <!-- Search input -->
        <div class="search-input mb-5 flex flex-col md:flex-row md:items-center gap-3">
            <label for="search" class="text-sm text-gray-700">Search:</label>
            <input type="text" id="search-input" placeholder="Search here"
                class="w-full md:w-1/4 p-2 border border-gray-300 rounded focus:outline-none">
        </div>

        <!-- Table -->
        <div class="table-container overflow-x-auto mt-5">
            <table class="min-w-full border-collapse mb-5">
                <thead>
                    <tr>
                        <th class="bg-black text-white p-2 border">#</th>
                        <th class="bg-black text-white p-2 border">Booking ID</th>
                        <th class="bg-black text-white p-2 border">Patient Name</th>
                        <th class="bg-black text-white p-2 border">Barcodes</th>
                        <th class="bg-black text-white p-2 border">Ref By</th>
                        <th class="bg-black text-white p-2 border">Test Name</th>
                    </tr>
                </thead>
                <tbody id="tab">
                </tbody>
            </table>
        </div>

        <!-- Download Buttons -->
        <div class="merge-div flex justify-center gap-4 flex-wrap">
            <button
                class="merge-button bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 flex items-center gap-2"
                id="download-selected-reports">
                <i class="fas fa-download"></i> Download Selected Reports
            </button>
            <button
                class="merge-button bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 flex items-center gap-2 hidden"
                id="merge-selected-reports">
                <i class="fas fa-file-pdf"></i> Merge Reports
            </button>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader1"
        class="loaderDiv1 hidden fixed top-0 left-0 w-full h-full bg-black bg-opacity-50 flex justify-center items-center z-50">
        <div class="spinner1 border-4 border-gray-200 border-t-blue-500 rounded-full w-12 h-12 animate-spin"></div>
        <p class="text-white ml-3">Generating PDF...</p>
    </div>
</body>

</html>
