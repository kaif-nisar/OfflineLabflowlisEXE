<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management | E-Commerce</title>
    <link rel="stylesheet" href="/css/tailwind-offline.css">
<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
    <style>
        .product-table tbody tr:nth-child(even) {
            background-color: #f9fafb;
        }

        .product-table tbody tr:hover {
            background-color: #f3f4f6;
        }

        .status-active {
            background: #d1fae5; /* Light green */
            color: #065f46; /* Dark green */
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            text-align: center;
        }
        .status-inactive {
            background: #fee2e2; /* Light red */
            color: #991b1b; /* Dark red */
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            text-align: center;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">

        <!-- Header + Add Product button -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Inventory Management</h1>
                <p class="text-gray-600">Manage your product inventory</p>
            </div>
            <div>
                <a onclick="loadPage('Addproduct')">
                    <button
                        class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                </a>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white p-6 rounded-lg shadow mb-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Search Products</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center">
                            <i class="fas fa-search text-gray-400"></i>
                        </div>
                        <input id="search" type="text" class="w-full pl-10 pr-4 py-2 border rounded focus:ring-blue-500"
                            placeholder="Name, SKU or category..." />
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                    <select id="categoryFilter" class="w-full px-3 py-2 border rounded focus:ring-blue-500">
                        <option value="">All Categories</option>
                        <option value="electronics">Electronics</option>
                        <option value="clothing">Clothing</option>
                        <option value="Health care">Health care</option>
                        <option value="home">Home & Kitchen</option>
                        <option value="beauty">Beauty & Personal Care</option>
                        <option value="sports">Sports & Outdoors</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="min-w-full product-table">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs uppercase">Created At</th>
                        <th class="px-6 py-3 text-left text-xs uppercase">Product</th>
                        <th class="px-6 py-3 text-left text-xs uppercase">SKU</th>
                        <th class="px-6 py-3 text-left text-xs uppercase">Category</th>
                        <th class="px-6 py-3 text-left text-xs uppercase">Price</th>
                        <th class="px-6 py-3 text-left text-xs uppercase">Stock</th>
                        <th class="px-6 py-3 text-left text-xs uppercase">Status</th>
                        <th class="px-6 py-3 text-right text-xs uppercase">Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody" class="divide-y"></tbody>
            </table>

            <!-- Pagination -->
            <div class="bg-gray-50 px-6 py-3 flex justify-between items-center">
                <p class="text-sm text-gray-700">
                    Showing <span id="showingFrom">0</span> to <span id="showingTo">0</span> of <span
                        id="totalCount">0</span> results
                </p>
                <div class="flex items-center gap-2">
                    <button id="prevPage" class="px-3 py-1 border rounded hover:bg-gray-100"><i
                            class="fas fa-chevron-left"></i></button>
                    <button id="nextPage" class="px-3 py-1 border rounded hover:bg-gray-100"><i
                            class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editProductModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-lg p-6 space-y-4">
            <h2 class="text-xl font-semibold">Edit Product</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="editId" />
                <label for="editName">Name
                <input id="editName" placeholder="Name" class="w-full px-3 py-2 border rounded" />
                </label>
                <label for="editSKU">SKU
                <input id="editSKU" placeholder="SKU" class="w-full px-3 py-2 border rounded" />
                </label>
                <label for="editCategory">Category
                <select id="editCategory" class="w-full px-3 py-2 border rounded">
                    <option value="electronics">Electronics</option>
                    <option value="clothing">Clothing</option>
                    <option value="Health care">Health Care</option>
                    <option value="home">Home & Kitchen</option>
                    <option value="beauty">Beauty & Personal Care</option>
                    <option value="sports">Sports & Outdoors</option>
                </select>
            </label>
                <label for="editstatus"> Status
                <select id="editstatus" class="w-full px-3 py-2 border rounded">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </label>
            <label for="editPrice">Price
                <input id="editPrice" type="number" step="0.01" placeholder="Price (₹)"
                    class="px-3 py-2 border rounded" />
            </label>
            <label for="editStock">Stock
                                <input id="editStock" type="number" placeholder="Stock Qty" class="px-3 py-2 border rounded" />
            </label>
            <label for="editdiscount">Discount
                <input id="editdiscount" type="number" placeholder="Discount" class="px-3 py-2 border rounded" />
            </label>
            <div class="text-right space-x-2">
                <button id="cancelEditBtn" class="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
                <button id="saveChangesBtn"
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
            </div>
        </div>
    </div>
</body>

</html>
