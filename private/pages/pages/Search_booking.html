<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Search Booking</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="/css/tailwind-offline.css">
</head>

<body class="font-sans bg-blue-50">
  <div class="container w-full max-w-5xl mx-auto p-5">
    <h1 class="text-2xl font-bold mb-4">Search Booking</h1>

    <!-- Breadcrumb -->
    <div class="breadcrumb text-sm text-gray-600 mb-5 flex items-center gap-1">
      <a href="#" class="text-gray-500 no-underline hover:underline flex items-center gap-1">
        <i class="fas fa-home"></i> Dashboard
      </a>
      <span>&gt;</span>
      <span>Search Booking</span>
    </div>

    <!-- Search box -->
    <div class="search-box flex flex-wrap gap-5 bg-white p-3 rounded-lg shadow mb-5">
      <i class="fas fa-users text-2xl text-gray-500 mr-3"></i>
      <input id="search-input" class="text w-80 p-2 border border-blue-200 rounded mr-3 text-base focus:outline-none" type="text" placeholder="Search...">
      <button id="search-button" class="bg-pink-500 text-white px-4 py-2 rounded hover:bg-pink-600 flex items-center gap-2">
        <i class="fas fa-search"></i> Search
      </button>
    </div>

    <!-- Table -->
    <div class="table-container overflow-x-auto mt-5">
      <table class="min-w-full border-collapse">
        <thead>
          <tr>
            <th class="bg-black text-white p-2 border">Booking ID</th>
            <th class="bg-black text-white p-2 border">Patient Name</th>
            <th class="bg-black text-white p-2 border">Barcodes</th>
            <th class="bg-black text-white p-2 border">Ref By</th>
            <th class="bg-black text-white p-2 border">Test Name</th>
            <th class="bg-black text-white p-2 border">Status</th>
            <th class="bg-black text-white p-2 border">Action</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Dynamic rows will be added here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Loader -->
  <div id="loader1" class="loaderDiv1 hidden fixed top-0 left-0 w-full h-full bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="spinner1 border-4 border-gray-200 border-t-blue-500 rounded-full w-12 h-12 animate-spin"></div>
    <p class="text-white ml-3">Generating PDF...</p>
  </div>
</body>

</html>
