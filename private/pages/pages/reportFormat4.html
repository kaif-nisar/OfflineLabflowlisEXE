<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Report</title>
<link href="/vendor/fontawesome/css/all.min.css" rel="stylesheet" />
<style id="stying">
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; font-family: Arial, sans-serif; font-size: 12px; color: #000; }

#reportFormat4Root {
    position: relative;
    background: #fff;
    width: 800px;
    max-width: calc(100vw - 20px);
    margin: 8px auto 96px;
    padding: 8px 10px 110px;
}

    /* Skeleton */
    .page-boot-loader { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; background: #f5f7fb; z-index: 20; opacity: 1; transition: opacity 220ms ease; }
    .page-boot-loader.is-hiding { opacity: 0; pointer-events: none; }
    .page-boot-shell { width: 100%; padding: 12px; }
    .page-boot-block { border-radius: 4px; background: linear-gradient(100deg,#e7e7e7 30%,#f5f5f5 45%,#e7e7e7 60%); background-size: 300% 100%; animation: skeleton-shimmer 1.1s ease-in-out infinite; height: 14px; margin-bottom: 6px; }
    .page-boot-text { margin-top: 10px; text-align: center; font: 600 13px Arial; color: #374151; }
    @keyframes skeleton-shimmer { 0%{background-position:100% 0;} 100%{background-position:-100% 0;} }

    /* ══════════════════════════
       HEADER  (no outer border)
    ══════════════════════════ */
    .report-details { margin-bottom: 8px; }

.hdr-wrap {
    display: grid;
    grid-template-columns: 2.1fr 0.7fr 1.2fr;
    gap: 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid #000;
}

    /* LEFT */
    .hdr-left { padding-right: 8px; }
.hdr-pt-name  { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .hdr-pt-row   { display: flex; font-size: 12px; margin-bottom: 3px; gap: 4px; }
    .hdr-pt-label { min-width: 76px; }
    .hdr-pt-val   { }
.hdr-qr-row   { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
#qrimg        { display: none; }
.hdr-powered  { font-size: 10px; font-weight: 700; }

    /* CENTER – barcode */
    .hdr-mid {
        display: flex; flex-direction: column;
        align-items: center; justify-content: flex-start;
        gap: 3px; padding-top: 2px;
        border-left: none; border-right: none;
    }
#barcodeImage { width: 130px; height: 34px; object-fit: contain; display: block; }
.hdr-barcode-id { font-size: 11px; letter-spacing: 1.5px; font-weight: 600; }

    /* RIGHT – QR + dates */
    .hdr-right {
        display: flex; flex-direction: column;
        align-items: flex-end; gap: 4px;
        padding-left: 8px;
    }
    .hdr-qr-block {
        display: flex; flex-direction: column;
        align-items: center; margin-bottom: 4px;
    }
    .hdr-scan-txt { font-size: 9px; color: #555; margin-bottom: 2px; }
#qrimgright   { width: 64px; height: 64px; object-fit: contain; border: 1px solid #bbb; padding: 3px; display: none; }
    .hdr-dates    { width: 100%; }
    .hdr-date-row { display: flex; font-size: 11.5px; margin-bottom: 2px; gap: 2px; }
    .hdr-dlabel   { min-width: 92px; }
    .hdr-dval     { }

    /* ══════════════════════════
       SECTIONS
    ══════════════════════════ */
    .container-format1 { background: #fff; }

    .sec-box { border: 1px solid #000; margin-top: 8px; }

    /* Category heading */
    .sec-cat {
        text-align: center; font-size: 13px; font-weight: 700;
        letter-spacing: 0.4px; padding: 5px 8px;
        border-bottom: 1px solid #000; background: #fff;
    }

    /* Sub-title */
    .sec-sub {
        text-align: center; font-size: 12.5px; font-weight: 400;
        padding: 4px 8px; border-bottom: 1px solid #000;
    }

    /* Documented / paragraph body */
    .sec-doc { padding: 6px 10px 8px; }
    .doc-row  { display: flex; gap: 2px; margin-bottom: 4px; font-size: 12px; line-height: 1.5; }
    .doc-lbl  { font-weight: 700; min-width: 148px; flex-shrink: 0; white-space: nowrap; }
    .doc-val  { flex: 1; }

    /* Table body */
.sec-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.sec-tbl thead th { background: #f2f2f2; border: 1px solid #000; padding: 5px 8px; font-weight: 700; text-transform: uppercase; }
.sec-tbl td { border: 1px solid #000; padding: 5px 8px; vertical-align: top; }
.sec-tbl th:nth-child(1), .sec-tbl td:nth-child(1) { width: 40%; }
.sec-tbl th:nth-child(2), .sec-tbl td:nth-child(2) { width: 18%; text-align: center; }
.sec-tbl th:nth-child(3), .sec-tbl td:nth-child(3) { width: 12%; text-align: center; }
.sec-tbl th:nth-child(4), .sec-tbl td:nth-child(4) { width: 30%; text-align: center; }
.row-abn, .BoldRow { font-weight: 700; }
.hl-tag  { font-weight: 700; margin-right: 2px; font-size: 11px; }

    /* Remark inside table */
    .remark-cell { font-size: 11px !important; padding: 3px 10px !important; }

    /* Interpretation */
    .sec-interp { padding: 7px 10px 8px; font-size: 11.5px; line-height: 1.55; border-top: 1px solid #000; }
    .sec-interp-title { font-weight: 700; margin-bottom: 3px; }

    /* Note */
    .sec-note { padding: 5px 10px 7px; font-size: 11px; line-height: 1.55; border-top: 1px solid #ccc; }
    .sec-note-title { font-weight: 700; margin-bottom: 3px; }

    /* End report */
    .end-report { text-align: center; font-size: 13px; padding: 16px 0 4px; }

    /* Signatures */
    .signed-off-div { margin-top: 12px; }
    .signed-off-div2 { display: flex; justify-content: space-between; padding: 8px 20px; }
    .left-sign, .right-sign { text-align: center; font-size: 11px; }
    .textspan { font-size: 11px; }

    .page-break { page-break-before: always; }
    .deletion, .wrong, .delete-btn { display: none !important; }

    /* Action bar */
    .download-pdf-div {
        position: fixed; bottom: 0; left: 0; right: 0;
        display: flex; flex-wrap: wrap; background: #fff;
        border-top: 1px solid #e5e7eb; padding: 6px 8px;
        z-index: 120; gap: 6px;
    }
    .downloadDiv { position: relative; }
    .downloadDiv button { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #loadingOverlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.15); }
    .format-loader { width: 18px; height: 18px; border: 3px solid #fff; border-top: 3px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media print {
        .download-pdf-div { display: none !important; }
        body { background: #fff; }
        #reportFormat4Root { padding: 0; margin: 0; width: 100%; max-width: none; }
    }

    /* Popup */
    .popup-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; justify-content: center; align-items: center; }
    .popup-modal.open { display: flex; }
    .popup-content { background: #fff; border-radius: 8px; padding: 16px; width: 90%; max-width: 700px; max-height: 90vh; display: flex; flex-direction: column; gap: 10px; }
    .popup-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .share-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .share-buttons button { padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; font-size: 13px; cursor: pointer; font-weight: 600; }
    .share-title { font-weight: 700; font-size: 14px; color: #1f2937; }
    .close-button { font-size: 22px; cursor: pointer; }
    .input-container { display: flex; gap: 8px; }
    .input-container input { flex: 1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .input-container button { padding: 6px 14px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 600; }
    .email-status-message { display: none; min-height: 20px; font-size: 13px; font-weight: 600; }
    .email-status-message[data-state="success"] { color: #15803d; }
    .email-status-message[data-state="error"] { color: #b91c1c; }
    .email-status-message[data-state="info"] { color: #1d4ed8; }
    .pdf-viewer { width: 100%; height: 500px; border: 1px solid #e5e7eb; border-radius: 4px; }
</style>
</head>
<body>
<div id="reportFormat4Root">

    <div id="pageBootLoader" class="page-boot-loader">
        <div class="page-boot-shell">
            <div class="page-boot-block" style="width:200px;height:20px;"></div>
            <div class="page-boot-block" style="width:160px;"></div>
            <div class="page-boot-block" style="width:180px;"></div>
            <div class="page-boot-block" style="width:100%;height:12px;margin-top:14px;"></div>
            <div class="page-boot-block" style="width:100%;height:12px;"></div>
            <div class="page-boot-block" style="width:100%;height:12px;"></div>
            <div class="page-boot-text">Preparing report...</div>
        </div>
    </div>

    <div class="container-format1" id="container">
        <div class="container22">
            <div class="report-details"></div>
            <div class="container2" id="containerpdf">
                <div id="tables-container"></div>
            </div>
            <div class="end-report">~~~ End of report ~~~</div>
        </div>
    </div>

    <div class="signed-off-div"></div>

    <div class="download-pdf-div">
        <div class="downloadDiv">
            <button id="signOff"><i class="fas fa-signature"></i><span>Sign</span></button>
            <div id="loadingOverlay"><div class="format-loader"></div></div>
        </div>
        <div class="downloadDiv">
            <button id="viewPDF" class="click"><i class="fas fa-file-pdf"></i><span>PDF</span></button>
            <div id="loadingOverlay"><div class="format-loader"></div></div>
        </div>
        <div class="downloadDiv">
            <button id="downloadPDF" class="click"><i class="fas fa-download"></i><span>Download</span></button>
            <div id="loadingOverlay"><div class="format-loader"></div></div>
        </div>
        <div class="downloadDiv">
            <button id="sendReport" class="click"><i class="fas fa-paper-plane"></i><span>Email Report</span></button>
            <div id="loadingOverlay"><div class="format-loader"></div></div>
        </div>
        <div class="downloadDiv">
            <button id="BrowserPrint" class="click"><i class="fas fa-print"></i><span>Browser</span></button>
            <div id="loadingOverlay"><div class="format-loader"></div></div>
        </div>
        <div class="downloadDiv" id="printsettingbutton">
            <a href="pages/pages/printsetting.html" id="PDFsettinganchr">
                <button id="PDFsetting" class="click"><i class="fas fa-gear"></i><span>Setting</span></button>
            </a>
            <div id="loadingOverlay"><div class="format-loader"></div></div>
        </div>
    </div>

    <div id="popupModal" class="popup-modal">
        <div class="popup-content">
            <div class="popup-header">
                <div class="share-buttons">
                    <span class="share-title">Email Report</span>
                    <button id="openPdfButton">Open PDF</button>
                </div>
                <div class="closeBtnDiv"><span class="close-button">&times;</span></div>
            </div>
            <div id="inputField" class="input-container">
                <input id="contactInput" type="email" placeholder="Enter Email Address" />
                <button id="sendButton">Send Email</button>
            </div>
            <div id="emailStatusMessage" class="email-status-message" aria-live="polite"></div>
            <iframe id="pdfFrame" src="" class="pdf-viewer"></iframe>
        </div>
    </div>

</div>
<script src="/vendor/jsbarcode/JsBarcode.all.min.js"></script>
<script src="/vendor/html2pdf/html2pdf.bundle.min.js"></script>
<script src="reportAction.shared.js"></script>
<script src="reportFormat4.js"></script>
</body>
</html>
