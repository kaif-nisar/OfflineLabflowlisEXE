<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Reports</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f2f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            margin: 20px auto;
        }

        .breadcrumb {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .breadcrumb a {
            color: #000;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb i {
            margin: 0 5px;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2.5rem 0px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-bar button {
            height: 2.5rem;
            background-color: #ff5e6c;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 0px 1rem;
            transition: background-color 0.3s;
        }

        .search-bar button:hover {
            background-color: #ff3b4f;
        }

        .search-input {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-input label {
            font-weight: 600;
        }

        .search-input input {
            height: 2rem;
            width: 300px;
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table th,
        table td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }

        table th {
            background-color: #000;
            color: #fff;
        }

        table td {
            background-color: rgba(0, 255, 0, 0.1);
        }

        table td a {
            color: #007bff;
            text-decoration: none;
        }

        table td a:hover {
            text-decoration: underline;
        }

        table td input[type="checkbox"] {
            margin: 0;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .search-start {
            height: 2.5rem;
            min-width: 200px;
            border: 1px solid rgb(155, 155, 155);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            align-items: center;
            background: #fff;
        }

        .sd-text {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1rem;
            font-weight: 600;
            background-color: #6c757d;
            color: #fff;
            padding: 0.7rem 0.8rem;
            white-space: nowrap;
        }

        input[type="date"] {
            font-size: 0.875rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #3a3f44;
            border: none;
            padding: 0 10px;
            flex: 1;
        }

        input:focus,
        select:focus {
            outline: none;
        }

        .search-start select {
            border: none;
            padding: 0 10px;
            flex: 1;
            font-size: 0.875rem;
        }

        .merge-button {
            padding: 0.6rem 1.2rem;
            background-color: rgb(0, 183, 255);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .merge-button:hover {
            background-color: rgb(0, 150, 210);
        }

        .merge-button.download {
            background-color: #007bff;
        }

        .merge-button.download:hover {
            background-color: #0056b3;
        }

        .merge-button.merge {
            background-color: #28a745;
        }

        .merge-button.merge:hover {
            background-color: #1e7e34;
        }

        .merge-button.hidden {
            display: none;
        }

        .merge-div {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* ✅ LOADER STYLES */
        .loaderDiv1 {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner1 {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            color: white;
            margin-left: 15px;
            font-size: 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media(max-width: 768px) {
            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-start {
                width: 100%;
            }

            .search-input input {
                width: 100%;
            }

            table {
                font-size: 12px;
            }

            table th,
            table td {
                padding: 8px 5px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <br><br>
        <div class="header">Download Reports</div>
        <div class="breadcrumb">
            <a href="#"><i class="fas fa-home"></i> Dashboard</a> <i class="fas fa-chevron-right"></i> Download Report
        </div>
        <div class="search-bar">
            <div class="search-start">
                <p class="sd-text">Start Date</p>
                <input id="start-date" type="date" value="">
            </div>
            <div class="search-start">
                <p class="sd-text">End Date</p>
                <input id="end-date" type="date" value="">
            </div>
            <div class="search-start">
                <select id="franchisee-select">
                    <option value="">-- Self --</option>
                </select>
            </div>
            <div class="search-start">
                <select id="myselect">
                    <option value="without">Without Letter Pad</option>
                    <option value="with">With Letter Pad</option>
                </select>
            </div>
            <button id="search-button"><i class="fas fa-search"></i> Search</button>
        </div>
        <div class="search-input">
            <label for="search-input">Search:</label>
            <input type="text" id="search-input" placeholder="Search by Booking ID, Patient Name, Barcode, etc.">
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Booking ID</th>
                        <th>Patient Name</th>
                        <th>Barcodes</th>
                        <th>Ref By</th>
                        <th>Test Name</th>
                    </tr>
                </thead>
                <tbody id="tab">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>
        <div class="merge-div">
            <button class="merge-button download" id="download-selected-reports">
                <i class="fas fa-download"></i> Download Selected Reports
            </button>
            <button class="merge-button merge hidden" id="merge-selected-reports">
                <i class="fas fa-file-pdf"></i> Merge Reports
            </button>
        </div>
    </div>
    
    <!-- ✅ LOADER -->
    <div id="loader1" class="loaderDiv1">
        <div class="spinner1"></div>
        <p class="loader-text">Generating PDF...</p>
    </div>
</body>

</html>
