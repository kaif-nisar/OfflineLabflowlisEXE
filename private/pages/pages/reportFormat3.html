        /* ✅ Documented content styles - applies to ALL CKEditor content */
        .documented-content {
            overflow-x: auto;
            word-wrap: break-word;
            background: white;
        }

        /* ✅ Isolate tables inside documented content */
        .documented-content table {
            border-collapse: separate !important;
            border-spacing: 0 !important;
            margin: 10px 0 !important;
            width: 100% !important;
            background: white !important;
        }

        .documented-content table td,
        .documented-content table th {
            border: 1px solid #ddd !important;
            padding: 8px !important;
            background: white !important;
        }

        .documented-content table thead th {
            background-color: #e9ecef !important;
            font-weight: 600;
        }

        /* ✅ Typography inside documented content */
        .documented-content p {
            margin: 8px 0;
        }

        .documented-content ul,
        .documented-content ol {
            margin: 10px 0;
            padding-left: 25px;
        }

        .documented-content h1 {
            font-size: 1.8em;
            margin: 15px 0 10px 0;
            font-weight: bold;
        }

        .documented-content h2 {
            font-size: 1.5em;
            margin: 12px 0 8px 0;
            font-weight: bold;
        }

        .documented-content h3 {
            font-size: 1.3em;
            margin: 10px 0 6px 0;
            font-weight: bold;
        }

        .documented-content h4,
        .documented-content h5,
        .documented-content h6 {
            margin: 8px 0 4px 0;
            font-weight: bold;
        }

        /* ✅ Blockquotes */
        .documented-content blockquote {
            border-left: 4px solid #ddd;
            padding-left: 15px;
            margin: 10px 0;
            color: #666;
            font-style: italic;
        }

        /* ✅ Code blocks */
        .documented-content pre {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .documented-content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        /* ✅ Images inside documented content */
        .documented-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px 0;
        }

        /* ✅ Links */
        .documented-content a {
            color: #1a73e8;
            text-decoration: underline;
        }

        /* ✅ Prevent documented content from breaking parent table */
        td[colspan="4"] {
            vertical-align: top;
            padding: 0 !important;
        }

        /* ✅ Details row specific styling */
        .details-row {
            padding: 0 !important;
            font-size: 13px;
        }

        .details-row .documented-content {
            padding-left: 20px;
        }

        /* ✅ Interpretation styling */
        .interpretation {
            padding: 10px;
        }

        .interpretation p {
            margin: 5px 0;
        }

        /* ✅ More details section */
        .moreDetails .documented-content {
            padding-left: 20px;
        }

<body>
    <div id="modal" class="modal" style="display: none;">
        <div class="form-section">
            <span class="close-btn" onclick="closeModal()">✖️</span> <!-- Close button -->
            <div class="selectTypeDiv">
                <label for="select-type">Select Type</label>
                <select id="select-type" onchange="toggleForm(this)">
                    <option value="numeric" selected>Numeric</option>
                    <option value="text">Text</option>
                </select>
            </div>

            <div id="form-container">
                <div class="row-container">
                    <span class="delete-btn" onclick="deleteRow(this)">🗑️</span>
                    <div class="row-item">
                        <label for="sex">Sex</label>
                        <select name="sex" class="sex">
                            <option value="Any">Any</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="row-item">
                        <label for="min_age">Min. Age</label>
                        <input type="number" name="min_age" placeholder="Min. age" class="min-age" value="0">
                    </div>
                    <div class="row-item">
                        <label for="min_age_unit">Min Age Unit</label>
                        <select name="min_age_unit">
                            <option value="Years">Years</option>
                            <option value="Months">Months</option>
                            <option value="Days">Days</option>
                        </select>
                    </div>
                    <div class="row-item">
                        <label for="max_age">Max. Age</label>
                        <input type="number" name="max_age" placeholder="Max. age" class="max-age" value="20">
                    </div>
                    <div class="row-item">
                        <label for="max_age_unit">Max Age Unit</label>
                        <select name="max_age_unit">
                            <option value="Years">Years</option>
                            <option value="Months">Months</option>
                            <option value="Days">Days</option>
                        </select>
                    </div>
                    <div class="row-item">
                        <label for="lower_value">Lower Value</label>
                        <input type="number" name="lower_value" placeholder="Lower value" class="lower-value"
                            value="2.1" oninput="updateReportDisplay(this)">
                    </div>
                    <div class="row-item">
                        <label for="upper_value">Upper Value</label>
                        <input type="number" name="upper_value" placeholder="Upper value" class="upper-value"
                            value="17.7" oninput="updateReportDisplay(this)">
                    </div>
                    <div class="row-item">
                        <label for="upper_value">Display report</label>
                        <span class="display-report">2.1 - 17.7</span>
                    </div>
                </div>
            </div>

            <textarea id="text-area" class="text-area" placeholder="Enter text here..."></textarea>

            <div class="add-more-btn" id="add-more-btn" onclick="addRow()">+ Add more</div>
            <div class="submit-div">
                <button id="submit-button"> Submit now</button>
            </div>
        </div>
    </div>
    <br><br>

    <div class="signed-off-div">

    </div>
    </div>
