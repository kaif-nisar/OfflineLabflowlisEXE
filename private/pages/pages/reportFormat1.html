        .page-boot-loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: #f3f6fb;
            z-index: 20;
            overflow: hidden;
            padding: 0;
            opacity: 1;
            transition: opacity 220ms ease;
        }

        .page-boot-loader.is-hiding {
            opacity: 0;
            pointer-events: none;
        }

        .page-boot-shell {
            width: min(1180px, calc(100vw - 24px));
            margin: 0;
            padding: 14px;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }

        .page-boot-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
        }

        .page-boot-block {
            border-radius: 8px;
            background: linear-gradient(100deg, #eef2f8 30%, #f8fbff 45%, #eef2f8 60%);
            background-size: 300% 100%;
            animation: skeleton-shimmer 1.2s ease-in-out infinite;
        }

        .page-boot-title {
            width: 210px;
            height: 30px;
        }

        .page-boot-pill {
            width: 200px;
            height: 28px;
            border-radius: 999px;
        }

        .page-boot-meta {
            margin-top: 14px;
            padding: 10px 10px 8px;
            border: 1px solid #b6b6b6;
            border-radius: 0;
            background: #fff;
        }

        .page-boot-meta-grid {
            display: grid;
            grid-template-columns: 42% 34% 24%;
            gap: 12px;
            align-items: start;
        }

        .page-boot-left-col,
        .page-boot-mid-col {
            min-height: 124px;
        }

        .page-boot-left-col {
            padding-right: 10px;
        }

        .page-boot-mid-col {
            padding: 0 10px;
            border-left: 1px solid #8f8f8f;
            border-right: 1px solid #8f8f8f;
        }

        .page-boot-meta-line {
            height: 12px;
        }

        .page-boot-meta-line.long {
            width: 100%;
        }

        .page-boot-meta-line.mid {
            width: 72%;
        }

        .page-boot-meta-line.small {
            width: 48%;
        }

        .page-boot-left-col,
        .page-boot-mid-col {
            display: grid;
            gap: 8px;
        }

        .page-boot-mid-col {
            padding-top: 2px;
        }

        .page-boot-kv {
            display: grid;
            grid-template-columns: 36% 64%;
            gap: 8px;
            align-items: center;
        }

        .page-boot-kv .label {
            height: 8px;
            width: 92%;
        }

        .page-boot-kv .value {
            height: 8px;
            width: 100%;
        }

        .page-boot-kv .value.strong {
            width: 56%;
            height: 12px;
        }

        .page-boot-barcode {
            width: 132px;
            height: 44px;
            border-radius: 4px;
            justify-self: start;
        }

        .page-boot-mid-title {
            width: 74%;
            height: 11px;
            margin-top: 2px;
        }

        .page-boot-qr-col {
            width: 100%;
            display: grid;
            gap: 6px;
            justify-items: center;
            align-content: start;
            padding-left: 8px;
        }

        .page-boot-qr-box {
            width: 116px;
            height: 102px;
            border-radius: 4px;
        }

        .page-boot-qr-text {
            width: 74px;
            height: 7px;
        }

        .page-boot-table {
            margin-top: 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .page-boot-table-head {
            height: 34px;
            background: #e6ebf3;
        }

        .page-boot-table-row {
            display: grid;
            grid-template-columns: 36% 15% 12% 37%;
            gap: 10px;
            padding: 10px 12px;
            border-top: 1px solid #eef2f7;
        }

        .page-boot-cell {
            height: 12px;
        }

        .page-boot-footer {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            gap: 18px;
        }

        .page-boot-sign {
            flex: 1;
            border: 1px dashed #d6dee9;
            border-radius: 8px;
            padding: 12px;
        }

        .page-boot-sign-line {
            width: 64%;
            height: 14px;
            margin-bottom: 10px;
        }

        .page-boot-sign-meta {
            width: 90%;
            height: 10px;
            margin-top: 8px;
        }

        .page-boot-text {

            letter-spacing: 0.2px;

        @keyframes skeleton-shimmer {

            100% {

        @media screen and (max-width:900px) {

            }

            }

            .page-boot-footer {

        .downloadDiv button::after,
        .input-container button::after {
            content: "";
            position: absolute;
            left: -35%;
            bottom: 0;
            width: 35%;
            height: 3px;
            background: linear-gradient(90deg, #22c55e 0%, #38bdf8 55%, #2563eb 100%);
            border-radius: 999px;
            opacity: 0;
            pointer-events: none;
        }

        .downloadDiv button.is-busy::after,
        .input-container button.is-busy::after {
            opacity: 1;
            animation: button-progress-slide 1.15s ease-in-out infinite;

        .input-container button.is-busy {
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);
