<!DOCTYPE html>
<html>
<head>
    <title>Assign Franchisee Credits</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #e3f2fd;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            flex: 1;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .breadcrumb {
            margin: 10px 0;
            font-size: 14px;
        }

        .breadcrumb i {
            margin-right: 5px;
        }

        .add-amount-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }

        .add-amount-btn:hover {
            background-color: #218838;
        }

        .content {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #e3f2fd;
            border-radius: 8px;
            padding: 20px;
            width: calc(33.33% - 13.33px);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            min-width: 300px;
            flex: 1;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        .form-group .input-group {
            display: flex;
            align-items: center;
        }

        .form-group .input-group i {
            padding: 10px;
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            border-right: none;
            border-radius: 4px 0 0 4px;
            color: #6c757d;
        }

        .form-group .input-group input {
            border-radius: 0 4px 4px 0;
            border-left: none;
        }

        .form-group.half-width {
            width: 48%;
            display: inline-block;
        }

        .btn-submit {
            background-color: #ff4d4d;
            color: #ffffff;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #e60000;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 16px;
        }

        .modal-content button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: background-color 0.3s;
        }

        .modal-content button:hover {
            background-color: #0056b3;
        }

        .modal-content .close-btn {
            background-color: #6c757d;
        }

        .modal-content .close-btn:hover {
            background-color: #545b62;
        }

        .current-amount {
            background-color: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #1976d2;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .card {
                width: calc(50% - 10px);
            }
            
            .form-group.half-width {
                width: 100%;
                display: block;
                margin-bottom: 15px;
            }
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 15px;
            }

            .header {
                padding: 15px;
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 20px;
            }

            .content {
                padding: 15px;
                flex-direction: column;
            }

            .card {
                width: 100%;
                min-width: auto;
            }

            .form-group.half-width {
                width: 100%;
                display: block;
            }

            .modal-content {
                margin: 20px;
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 18px;
            }

            .breadcrumb {
                font-size: 12px;
            }

            .card h2 {
                font-size: 16px;
            }

            .btn-submit {
                width: 100%;
                justify-content: center;
            }

            .add-amount-btn {
                padding: 8px 16px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="pin-modal" class="modal show">
        <div class="modal-content">
            <h2>Enter Security PIN</h2>
            <input type="password" id="security-pin" placeholder="Enter PIN">
            <button onclick="verifyPin()">Submit</button>
        </div>
    </div>

    <div id="amount-modal" class="modal">
        <div class="modal-content">
            <h2><i class="fas fa-wallet"></i> Add Amount</h2>
            <div class="current-amount">
                <i class="fas fa-coins"></i> Current Amount: ₹25,000
            </div>
            <input type="number" id="add-amount" placeholder="Enter amount to add" min="1">
            <div style="margin-top: 20px;">
                <button onclick="submitAmount()">
                    <i class="fas fa-plus"></i> Add Amount
                </button>
                <button class="close-btn" onclick="closeAmountModal()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>Assign Franchisee Credits</h1>
                <div class="breadcrumb">
                    <i class="fas fa-home"></i> Dashboard &gt; Credits
                </div>
            </div>
            <button class="add-amount-btn" onclick="openAmountModal()">
                <i class="fas fa-plus-circle"></i> Add Amount
            </button>
        </div>
        <div class="content">
            <div class="card">
                <h2><i class="fas fa-crown" style="color: #ffc107; margin-right: 8px;"></i>Assign Super Franchisee Credits</h2>
                <div class="form-group">
                    <label for="super-franchisee">Select Super Franchisee *</label>
                    <select id="super-franchisee">
                        <option disabled>-- Select Super Franchisee --</option>
                    </select>
                </div>
                <div class="form-group half-width" style="margin-right: 4%;">
                    <label for="super-transaction-type">Transaction Type *</label>
                    <div class="input-group">
                        <i class="fas fa-exchange-alt"></i>
                        <select id="super-transaction-type">
                            <option value="Debit">Credit</option>
                            <option value="Credit">Debit</option>
                        </select>
                    </div>
                </div>
                <div class="form-group half-width">
                    <label for="super-credits">No of Credits *</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="number" id="super-credits" placeholder="Enter credits">
                    </div>
                </div>
                <div class="form-group">
                    <label for="super-remarks">Remarks</label>
                    <textarea id="super-remarks" rows="4" placeholder="Enter Payment Remarks"></textarea>
                </div>
                <button class="btn-submit"><i class="fas fa-sign-in-alt"></i> Submit</button>
            </div>

            <div class="card">
                <h2><i class="fas fa-store" style="color: #17a2b8; margin-right: 8px;"></i>Assign Franchisee Credits</h2>
                <div class="form-group">
                    <label for="franchisee">Select Franchisee *</label>
                    <select id="franchisee">
                        <option disabled>-- Select Franchisee --</option>
                    </select>
                </div>
                <div class="form-group half-width" style="margin-right: 4%;">
                    <label for="transaction-type">Transaction Type *</label>
                    <div class="input-group">
                        <i class="fas fa-exchange-alt"></i>
                        <select id="transaction-type">
                            <option value="Debit">Credit</option>
                            <option value="Credit">Debit</option>
                        </select>
                    </div>
                </div>
                <div class="form-group half-width">
                    <label for="credits">No of Credits *</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="number" id="credits" placeholder="Enter credits">
                    </div>
                </div>
                <div class="form-group">
                    <label for="remarks">Remarks</label>
                    <textarea id="remarks" rows="4" placeholder="Enter Payment Remarks"></textarea>
                </div>
                <button class="btn-submit"><i class="fas fa-sign-in-alt"></i> Submit</button>
            </div>

            <div class="card">
                <h2><i class="fas fa-building" style="color: #28a745; margin-right: 8px;"></i>Assign Sub Franchisee Credits</h2>
                <div class="form-group">
                    <label for="sub-franchisee">Select Sub Franchisee *</label>
                    <select id="sub-franchisee">
                        <option disabled>-- Select Sub Franchisee --</option>
                    </select>
                </div>
                <div class="form-group half-width" style="margin-right: 4%;">
                    <label for="sub-transaction-type">Transaction Type *</label>
                    <div class="input-group">
                        <i class="fas fa-exchange-alt"></i>
                        <select id="sub-transaction-type">
                            <option value="Debit">Credit</option>
                            <option value="Credit">Debit</option>
                        </select>
                    </div>
                </div>
                <div class="form-group half-width">
                    <label for="sub-credits">No of Credits *</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="number" id="sub-credits" placeholder="Enter credits">
                    </div>
                </div>
                <div class="form-group">
                    <label for="sub-remarks">Remarks</label>
                    <textarea id="sub-remarks" rows="4" placeholder="Enter Payment Remarks"></textarea>
                </div>
                <button class="btn-submit"><i class="fas fa-sign-in-alt"></i> Submit</button>
            </div>
        </div>
    </div>
</body>
</html>
