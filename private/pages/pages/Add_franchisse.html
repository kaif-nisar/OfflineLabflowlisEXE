<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franchisee</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            line-height: 1.6;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .header i {
            margin-right: 10px;
            font-size: 20px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
        }

        .breadcrumb {
            font-size: 14px;
            color: #888;
            margin-left: 10px;
        }

        .breadcrumb a {
            color: #888;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .form-section {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .form-section .card {
            flex: 1;
            min-width: 280px;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-section .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }

        .form-section .card input,
        .form-section .card select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-section .card input:focus,
        .form-section .card select:focus {
            outline: none;
            border-color: #ff4d4d;
        }

        .form-section .card input[type="date"] {
            padding: 8px;
        }

        .form-section .card .submit-btn {
            width: 100%;
            background-color: #ff4d4d;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .form-section .card .submit-btn:hover {
            background-color: #e60000;
        }

        .form-section .card .icon-input {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
        }

        .form-section .card .icon-input i {
            position: absolute;
            left: 12px;
            color: #888;
            z-index: 1;
        }

        .form-section .card .icon-input input[type="password"] {
            padding-left: 40px;
        }

        .form-section .card .icon-input input[type="text"]:has(+ i),
        .form-section .card .icon-input input:last-child:not(#username) {
            padding-left: 40px;
        }

        #franchisee-username {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #555;
            width: 30%;
            min-width: 80px;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 4px 0 0 4px;
            background-color: #e9e9e9;
            height: 40px;
            text-align: center;
            user-select: none;
            cursor: not-allowed;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #username {
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 0 4px 4px 0;
            border-left: none;
            height: 40px;
            font-size: 14px;
            color: #555;
        }

        .icon-input:has(#franchisee-username) {
            margin-bottom: 10px;
            display: flex;
            align-items: stretch;
        }

        /* Tablet Responsive */
        @media (max-width: 1024px) {
            .container {
                width: 95%;
                padding: 15px;
            }

            .form-section .card {
                min-width: 45%;
            }

            .header h1 {
                font-size: 22px;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                width: 98%;
                margin: 10px auto;
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 20px;
                margin-bottom: 5px;
            }

            .breadcrumb {
                margin-left: 0;
                margin-top: 5px;
            }

            .form-section {
                flex-direction: column;
            }

            .form-section .card {
                width: 100%;
                min-width: 100%;
                margin-bottom: 15px;
            }

            .form-section .card h2 {
                font-size: 16px;
            }

            #franchisee-username {
                width: 35%;
                font-size: 12px;
                padding: 8px;
            }

            #username {
                width: 65%;
                font-size: 14px;
            }
        }

        /* Small Mobile */
        @media (max-width: 480px) {
            .container {
                padding: 10px;
                border-radius: 4px;
            }

            .header h1 {
                font-size: 18px;
            }

            .breadcrumb {
                font-size: 12px;
            }

            .form-section .card {
                padding: 15px;
            }

            .form-section .card h2 {
                font-size: 16px;
                margin-bottom: 15px;
            }

            .form-section .card input,
            .form-section .card select {
                padding: 10px;
                font-size: 14px;
            }

            .form-section .card .submit-btn {
                padding: 12px;
                font-size: 15px;
            }

            #franchisee-username {
                width: 40%;
                font-size: 11px;
                padding: 8px 5px;
            }

            #username {
                width: 60%;
                padding: 8px;
            }

            .form-section .card .icon-input i {
                left: 10px;
                font-size: 14px;
            }
        }

        /* Extra Small Mobile */
        @media (max-width: 360px) {
            .container {
                width: 100%;
                margin: 5px auto;
                padding: 8px;
            }

            .header h1 {
                font-size: 16px;
            }

            .form-section .card {
                padding: 12px;
            }

            .form-section .card h2 {
                font-size: 15px;
            }

            #franchisee-username {
                width: 35%;
                font-size: 10px;
                padding: 8px 3px;
            }

            #username {
                width: 65%;
            }
        }

        /* Landscape Mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            .form-section {
                flex-direction: row;
            }

            .form-section .card {
                width: 48%;
                min-width: 48%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <br><br>
        <div class="header">
            <i class="fas fa-home"></i>
            <h1>Franchisee</h1>
            <div class="breadcrumb">
                <a href="#">Dashboard</a> &gt; <a href="#">Franchisee</a>
            </div>
        </div>
        <br><br>
        <div class="form-section">
            <div class="card">
                <h2>Personal Details</h2>
                <input type="text" id="firstname" placeholder="Fullname" required>
                <input type="email" id="email" placeholder="Email ID" required>
                <input type="text" id="phone" placeholder="Phone No" required>
            </div>
            <div class="card">
                <h2>Area Information</h2>
                <div class="icon-input">
                    <div id="franchisee-username"></div><input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="icon-input">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter Password *" required>
                </div>
                <div class="icon-input">
                    <input type="text" id="state" placeholder="Enter State *" required>
                </div>
                <div class="icon-input">
                    <input type="text" id="city" placeholder="Enter City *" required>
                </div>
                <div class="icon-input">
                    <input type="text" id="district" placeholder="Enter District *" required>
                </div>
                <div class="icon-input">
                    <input type="text" id="postOffice" placeholder="Enter PostOffice *" required>
                </div>
                <div class="icon-input">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" id="pincode" placeholder="Enter Pincode" required>
                </div>
                <input type="text" id="address" placeholder="Enter Address" required>
            </div>
            <div class="card">
                <h2>Submission</h2>
                <input type="date" id="submissionDate" value="2024-09-08" required>
                <button class="submit-btn" id="submitBtn"><i class="fas fa-paper-plane"></i> Submit</button>
            </div>
        </div>
    </div>
    
    <script src="Add_franchisse.js"></script>
</body>
</html>
