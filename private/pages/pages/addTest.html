<html>

<head>

    <title>Form Page</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <style>
        .conta {
            padding: 50px 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
        }

        .form-row .form-group {
            flex: 1;
            margin-right: 10px;
        }

        .form-row .form-group:last-child {
            margin-right: 0;
        }

        .parameters-section {
            margin: 30px 0px;
        }

        .parameters-section h3 {
            font-size: 1.25rem;
            margin-bottom: 10px;
        }

        .parameters-table2 {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            margin-top: 10px;
        }

        .parameters-table2 th,
        .parameters-table2 td {
            border: 1px solid #dee2e6;
            padding: 8px;
            text-align: center;
        }

        .parameters-table2 td {
            margin-top: 20px;
        }

        .parameters-table2 th {
            background-color: #f1f3f5;
        }

        .parameters-table2 input,
        .parameters-table2 select {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        .parameters-table2 .remove-link {
            color: #007bff;
            text-decoration: none;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .add-parameter-link {
            color: #007bff;
            text-decoration: none;
            font-size: 1rem;
            cursor: pointer;
        }

        .containerg {
            max-width: 100%;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #ccc;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #007bff;
        }

        .tab.active {
            border-bottom: 2px solid #007bff;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .notification {
            background-color: #f8f9fa;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 4px;
            color: #d9534f;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .notification i {
            margin-right: 10px;
        }

        .editor {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }

        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .editor-toolbar select,
        .editor-toolbar button {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            cursor: pointer;
        }

        .editor-content {
            min-height: 100px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .footer button {
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
        }

        .footer .view-buttons {
            display: flex;
            gap: 10px;
        }

        .footer .view-buttons button {
            background-color: #f8f9fa;
            color: #000;
        }

        .form-section {
            max-width: 100%;
            margin-bottom: 0rem;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 0px;
        }

        .row-container {
            display: flex;
            align-items: center;
            /* margin-bottom: 15px; */
            /* border: 1px solid #e0e0e0; */
            padding: 5px;
            /* border-radius: 6px; */
            /* background: #f9f9f9; */
            gap: 5px;
            text-align: left;
        }

        /* .row-item {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 80px;
        } */

        .row-item label {
            font-size: 0.9rem;
            /* font-weight: bold; */
            color: #333;
            margin-bottom: 5px;
        }

        .row-item input,
        .row-item select {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .delete-btn {
            color: #d9534f;
            cursor: pointer;
            font-size: 18px;
            align-self: center;
        }

        .display-report {
            font-weight: 500;
            color: #555;
            margin-left: 10px;
            /* Add space on the left */
            font-size: 14px;
        }

        .add-more-btn {
            display: flex;
            align-items: center;
            color: #5bc0de;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }

        .add-more-btn:hover {
            color: #31b0d5;
        }

        .normal-value {
            margin-top: 2rem;
            padding: 0.4rem;
            font-size: 1.25rem;
        }

        .text-area {
            display: none;
            height: 4rem;
            width: 100%;
            border-radius: 0.5rem;
            /* Hide text area by default */
            margin-top: 15px;
            padding: 1rem;
        }

        .selectTypeDiv {
            width: 100%;
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            /* justify-content: center; */
        }

        .selectTypeDiv select {
            width: 25%;
        }

        .selectTypeDiv select {
            padding: 4px 8px;
            border-radius: 5px;
            margin-left: 0.5rem;
        }

        /* Style the modal */
        .mymodal {
            display: none;
            /* Hidden by default */
            position: fixed;
            /* Stay in place */
            z-index: 300; /* Sit on top */
            /* Sit on top */
            left: 0;
            top: 0;
            width: 100%;
            /* Full width */
            height: 100%;
            /* Full height */
            overflow: auto;
            /* Enable scroll if needed */
            background-color: rgb(0, 0, 0);
            /* Fallback color */
            background-color: rgba(0, 0, 0, 0.4);
            /* Black w/ opacity */
        }

        .mymodal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 30%;
            /* Could be more or less, depending on screen size */
        }

        .close-modal {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close-modal:hover,
        .close-modal:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .add-unit-icon {
            font-size: 20px;
            cursor: pointer;
            color: #007bff;
            margin-left: 10px;
            font-weight: bold;
        }

        .add-unit-icon:hover {
            color: #0056b3;
        }

        .normalValue {
            width: 55%;
            background-color: #f9f9f9;
        }

        .minAge,
        .maxAge {
            display: flex;
        }

        .unitHead {
            width: 10%;
        }

        input.min-age,
        input.max-age {
            width: 3.5rem;
            border-right: none;
            border-top-right-radius: 0px;
            border-bottom-right-radius: 0px;
        }

        select[name="min_age_unit"],
        select[name="max_age_unit"] {
            width: 5rem;
            border-top-left-radius: 0px;
            border-bottom-left-radius: 0px;
        }

        select.sex {
            width: 4rem;
        }

        .errormessage {
            display: none;
            color: #B00020;
            padding: 5px;
        }

        .sampletypebuttondiv {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sampletypebuttondiv button {
            padding: 2px 5px;
            font-size: 0.75rem;
        }

        .modal-content {
            padding: 20px;
        }

        .page-alert {
            position: fixed;
            width: 75%;
            top: 80px;
            right: 2%;
            z-index: 1050;
        }

        .modal-alert {
            position: static;
            width: auto;
            margin: 0 0 1rem;
        }

        .sample-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 105;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .sample-modal-overlay.show {
            display: flex;
        }

        .sample-modal {
            width: min(520px, 100%);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
            position: relative;
            z-index: 3;
            pointer-events: auto;
            opacity: 1;
            transform: none;
        }

        .sample-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.25rem 0.75rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .sample-modal-body {
            padding: 1rem 1.25rem 0.5rem;
        }

        .sample-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem 1.25rem;
        }

        .sample-modal-close {
            border: 0;
            background: transparent;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            color: #6b7280;
        }

        .editor-container {
            background-color: white;
        }

        .random-section {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #f9f9f9;
        }

        .random-checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .random-checkbox-container input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .random-inputs {
            display: none;
            gap: 10px;
        }

        .random-inputs.active {
            display: flex;
        }

        .random-input-group {
            flex: 1;
        }

        .random-input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .random-input-group input {
            width: 100%;
            padding: 6px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }
        .modal-backdrop {
            z-index: -1;
        }
        /* .modal {
            z-index: 300000000002 !important;
        } */
    </style>
    <link rel="stylesheet" href="/vendor/ckeditor5/ckeditor5.css">
</head>

<body>
    <div class="conta" id="conta">
        <div class="page-alert alert" role="alert"></div>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
            <span class="errormessage">!comma (,) not-allowed in this field</span>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="short-name">Short name</label>
                <input type="text" id="short-name" name="short-name">
            </div>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
            </select>
        </div>
        <div class="form-group">
            <label for="price">Billing Price</label>
            <input type="text" id="price" name="final-price">
        </div>
        <div class="form-group">
            <label for="final-price">MRP Price</label>
            <input type="text" id="final-price" name="final-price">
        </div>
        <div class="form-group">
            <label for="tat">TAT (Sample process timing for this test)</label>
            <input type="text" id="tat" name="tat" placeholder="example: 2 days">
        </div>
        <div class="parameters-section">
            <h3>Parameters</h3>
            <table class="parameters-table2" id="parameters-table2">
                <thead>
                    <tr>
                        <th>Del.</th>
                        <th>* Order</th>
                        <th>* Name</th>
                        <th class="unitHead">Unit <span class="add-unit-icon" id="add-unit-icon">+</span>
                            <!-- Add this line --></th>
                        <th>Default</th>
                        <th class="normalValue">Normal Value
                        </th>
                    </tr>
                </thead>
                <tbody class="all-parameters" id="all-parameters">
                    <!-- Update the parameter row HTML in the table body -->
                    <tr>
                        <td><span class="remove-link2" id="remove-link">🗑️</span></td>
                        <td><input type="text" value="1"></td>
                        <td><input type="text" id="paraName"></td>
                        <td>
                            <select id="unit-select">
                                <option value="">select Unit</option>
                            </select>
                        </td>
                        <td><input type="text"></td>
                        <td class="normalValue">
                            <div class="selectTypeDiv">
                                <label for="select-type">Select Type</label>
                                <select id="select-type" onchange="toggleForm(this)">
                                    <option value="numeric" selected>Numeric</option>
                                    <option value="text">Text</option>
                                </select>
                            </div>

                            <!-- Random Number Section -->
                            <div class="random-section">
                                <div class="random-checkbox-container">
                                    <input type="checkbox" id="random-checkbox" class="random-checkbox"
                                        onchange="toggleRandomInputs(this)">
                                    <label for="random-checkbox">Show Random Number</label>
                                </div>
                                <div class="random-inputs">
                                    <div class="random-input-group">
                                        <label for="lower-range">Lower Range</label>
                                        <input type="number" class="lower-range" placeholder="e.g., 5.0" step="0.01">
                                    </div>
                                    <div class="random-input-group">
                                        <label for="upper-range">Upper Range</label>
                                        <input type="number" class="upper-range" placeholder="e.g., 15.0" step="0.01">
                                    </div>
                                </div>
                            </div>

                            <div id="form-container">
                                <div class="row-container">
                                    <span class="delete-btn" onclick="deleteRow(this)"><i
                                            class="fa-solid fa-eraser"></i></span>
                                    <div class="row-item">
                                        <label for="sex">Sex</label>
                                        <select name="sex" class="sex">
                                            <option value="Any">Any</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                        </select>
                                    </div>
                                    <div class="row-item">
                                        <label for="min_age">Min. Age</label>
                                        <div class="minAge">
                                            <input type="number" name="min_age" placeholder="Min. age" class="min-age"
                                                value="0">
                                            <select name="min_age_unit">
                                                <option value="Years">Years</option>
                                                <option value="Months">Months</option>
                                                <option value="Days">Days</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="row-item">
                                        <label for="max_age">Max. Age</label>
                                        <div class="maxAge">
                                            <input type="number" name="max_age" placeholder="Max. age" class="max-age"
                                                value="100">
                                            <select name="max_age_unit">
                                                <option value="Years">Years</option>
                                                <option value="Months">Months</option>
                                                <option value="Days">Days</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="row-item">
                                        <label for="lower_value">Lower</label>
                                        <input type="number" name="lower_value" placeholder="Lower value"
                                            class="lower-value" value="2.1">
                                    </div>
                                    <div class="row-item">
                                        <label for="upper_value">Upper</label>
                                        <input type="number" name="upper_value" placeholder="Upper value"
                                            class="upper-value" value="17.7">
                                    </div>
                                </div>
                            </div>

                            <textarea id="text-area" class="text-area" placeholder="Enter text here..."></textarea>

                            <div class="add-more-btn" id="add-more-btn" onclick="addRow(this)">+ Add more</div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- <span class="add-parameter-link" id="add-parameter-link" onclick="addParameter()">+ Add more parameters</span> -->
            <span class="add-parameter-link" id="add-parameter-link">+ Add more parameters</span>

        </div>

        <!-- Modal for Adding Unit -->
        <div id="unit-modal" class="mymodal">
            <div class="mymodal-content">
                <span class="close-modal" id="close-modal">&times;</span>
                <h2>Add New Unit</h2>
                <input type="text" id="new-unit-name" placeholder="Enter unit name">
                <button id="save-unit">Save Unit</button>
            </div>
        </div>

        <div class="containerg">
            <div class="tabs">
                <div class="tab active">More details</div>
            </div>
            <div class="form-group">
                <div class="sampletypebuttondiv">
                    <label for="method">Sample Type</label>
                    <button type="button" class="btn btn-primary" id="openSampleModal">+ Add</button>
                </div>
                <div class="sample-modal-overlay" id="exampleModal" aria-hidden="true">
                    <div class="sample-modal" role="dialog" aria-modal="true" aria-labelledby="exampleModalLabel">
                        <div class="sample-modal-header">
                            <h5 class="modal-title" id="exampleModalLabel">Add Sample Type</h5>
                            <button type="button" class="sample-modal-close" id="closeSampleModal" aria-label="Close">&times;</button>
                        </div>
                        <div class="alert modal-alert" id="alert" role="alert"></div>
                        <div class="sample-modal-body">
                            <form>
                                <div class="form-group">
                                    <label for="recipient-name" class="col-form-label">Name:</label>
                                    <input type="text" class="form-control" id="sample-name">
                                </div>
                            </form>
                        </div>
                        <div class="sample-modal-footer">
                            <button type="button" class="btn btn-secondary" id="closeSampleModalFooter">Close</button>
                            <button type="button" id="sampleaddbtn" class="btn btn-primary">Save</button>
                        </div>
                    </div>
                </div>
                <select id="sampleType">
                    <option>SERUM</option>
                    <option>EDTA</option>
                    <option>URINE</option>
                    <option>FLOURISHED</option>
                    <option>Sodium Citrate</option>
                    <option>Sodium Heparin</option>
                    <option>Lithium Heparin</option>
                </select>
            </div>
            <div class="form-group">
                <label for="method">Method</label>
                <input type="text" id="method" name="method">
            </div>
            <div class="form-group">
                <label for="instrument">Instrument</label>
                <input type="text" id="instrument" name="instrument">
            </div>
            <div class="checkbox-container">
                <label>
                    <input type="checkbox" id="hide-method-instrument"> Hide method and instrument from lab report
                </label>
            </div>
            <div class="checkbox-container">
                <label>
                    <input type="checkbox" id="hide-interpretation"> Hide interpretation from lab report
                </label>
            </div>
            <div class="form-group">
                <label for="interpretation">Interpretation</label>
                <div class="editor-container">
                    <div id="editor-toolbar"></div>
                    <div id="editor"></div>
                    <div id="editor-word-count"></div>
                </div>
            </div>
            <div class="footer">
                <button class="submitbBtn" id="submitbBtn" data-alternate-id="another-identifier">Save</button>
            </div>
        </div>
    </div>
    <script src="/vendor/ckeditor5/browser/ckeditor5.umd.js"></script>
    <script src="/editor.js"></script>
    <script src="addTest.js"></script>
</body>

</html>
