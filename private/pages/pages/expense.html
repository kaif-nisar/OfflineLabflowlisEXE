<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expenses Management</title>
    <style>
        #editModal {
            z-index: 100000;
        }

        .editform {
            margin: 25px 0px;
        }
        canvas {
            width: 80% !important;
            height: 50vh !important;
        }
        @media screen and (max-width: 500px) {
            .chard-div {
                width: 100%;
                height: 65vh;
            }
                    canvas {
            width: 80% !important;
            height: 45vh !important;
        }
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen p-6 font-sans text-gray-700">

    <header class="flex flex-col sm:flex-row sm:items-center justify-between mb-8">
        <div>
            <h1 class="text-3xl font-extrabold flex items-center gap-3">
                Expenses
            </h1>

        </div>
        <div class="flex gap-3 mt-4 sm:mt-0">
            <button id="addNewExpenseBtn" type="button" onclick="loadPage('addexpense')"
                class="inline-flex items-center gap-2 rounded bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-blue-600">
                + Add new
            </button>
        </div>
    </header>

    <section class="mb-6">
        <div class="flex flex-wrap items-center gap-3 mt-2">
            <input type="text" id="dateRange"
                class="cursor-pointer rounded border border-gray-300 bg-white px-4 py-2 text-gray-700 shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                value="01/06/2025 - 27/06/2025" aria-label="Date range for filtering expenses" />
            <button id="searchExpensesBtn"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm font-medium">
                Search
            </button>
        </div>
    </section>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-10 overflow-auto">
        <div class="lg:col-span-4 bg-white rounded-lg p-6 shadow-sm">
            <div class="mb-5">
                <p class="text-gray-500 font-semibold">Total Expense</p>
                <p id="totalExpense" class="text-3xl font-light mt-1">Rs.500</p>
            </div>

            <div>
                <p class="font-semibold mb-3">Total expense split</p>
                <div class="flex justify-between text-sm font-semibold text-gray-700 flex-wrap">
                    <div class="flex flex-col items-center text-center gap-1 p-5">
                        <div> <span class="text-2xl select-none">💼</span></div>
                        <div>Cash</div>
                        <div id="cashAmount" class="mt-1 text-lg font-normal">Rs.0</div>
                    </div>
                    <div class="flex flex-col items-center text-center gap-1 p-5">
                        <div><span class="text-2xl select-none">💳</span></div>
                        <div>Card</div>
                        <div id="cardAmount" class="mt-1 text-lg font-normal">Rs.500</div>
                    </div>
                    <div class="flex flex-col items-center text-center gap-1 p-5">
                        <div><span class="text-2xl select-none">📲</span></div>
                        <div>UPI</div>
                        <div id="upiAmount" class="mt-1 text-lg font-normal">Rs.0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8 bg-blue-50 rounded-lg p-6 shadow-sm w-[500px] h-[80vh] flex items-center justify-evenly flex-col gap-1 chard-div">
            <h3 class="mb-2 text-2xl  text-gray-700">Category wise split:</h3>
            <canvas id="categoryPieChart" aria-label="Pie chart showing expenses split by category" role="img"
                class="rounded-md"></canvas>
            <div id="categoryLegend" class="mt-4 flex gap-4 flex-wrap"></div>
        </div>
    </main>

    <section>
        <h2 class="text-xl font-semibold mb-4">All Expenses</h2>
        <div class="overflow-x-auto rounded-lg border border-gray-200 bg-white shadow-sm">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th scope="col"
                            class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Date</th>
                        <th scope="col"
                            class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Category</th>
                        <th scope="col"
                            class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Name</th>
                        <th scope="col"
                            class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Payment Mode</th>
                        <th scope="col"
                            class="px-4 py-3 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Amount (Rs.)</th>
                        <th scope="col"
                            class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                            Notes</th>
                        <th scope="col" class="relative px-4 py-3"><span class="sr-only">Edit</span></th>
                    </tr>
                </thead>
                <tbody id="expensesTableBody" class="divide-y divide-gray-100">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- Edit Expense Modal -->
    <div id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle"
        class="fixed inset-0 z-100 flex justify-center bg-black bg-opacity-50 hidden overflow-y-scroll">
        <div class="bg-white rounded-lg shadow-lg max-w-lg w-full p-6 relative editform h-[130vh]">
            <h3 id="editModalTitle" class="text-xl font-semibold mb-4">Edit Expense</h3>
            <form id="editExpenseForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                    <input type="text" id="name" name="name" required
                        class="mt-1 block w-full rounded border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="editDate" class="block text-sm font-medium text-gray-700">Date</label>
                    <input type="date" id="editDate" name="date" required
                        class="mt-1 block w-full rounded border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="editCategory" class="block text-sm font-medium text-gray-700">Category</label>
                    <input type="text" id="editCategory" name="category" required
                        class="mt-1 block w-full rounded border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                        autocomplete="off" />
                </div>
                <div>
                    <label for="editPaymentMode" class="block text-sm font-medium text-gray-700">Payment Mode</label>
                    <select id="editPaymentMode" name="paymentMode" required
                        class="mt-1 block w-full rounded border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <option>Cash</option>
                        <option>Credit</option>
                        <option>Debit</option>
                        <option>Online</option>
                    </select>
                </div>
                <div>
                    <label for="editAmount" class="block text-sm font-medium text-gray-700">Amount (Rs.)</label>
                    <input type="number" min="0" step="0.01" id="editAmount" name="amount" required
                        class="mt-1 block w-full rounded border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="editNotes" class="block text-sm font-medium text-gray-700">Notes</label>
                    <textarea id="editNotes" name="notes" rows="2"
                        class="mt-1 block w-full resize-y rounded border border-gray-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" id="cancelEditBtn"
                        class="rounded bg-gray-200 py-2 px-4 text-gray-700 hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400">Cancel</button>
                    <button type="submit"
                        class="rounded bg-blue-600 py-2 px-5 text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600">Save</button>
                </div>
            </form>
            <button id="closeEditModalBtn" aria-label="Close edit modal"
                class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded"
                type="button">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
    </div>
</body>

</html>
