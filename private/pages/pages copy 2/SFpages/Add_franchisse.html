<html></html>
<head>
    <title>Franchisee</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 95%;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .header i {
            margin-right: 10px;
        }
        .header h1 {
            font-size: 24px;
            margin: 0;
        }
        .breadcrumb {
            font-size: 14px;
            color: #888;
            margin-left: 10px;
        }
        .breadcrumb a {
            color: #888;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        .form-section {
            display: flex;
            justify-content: space-between;
        }
        .form-section .card {
            width: 28%;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .form-section .card h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .form-section .card input,
        .form-section .card select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-section .card input[type="date"] {
            padding: 8px;
        }
        .form-section .card .submit-btn {
            background-color: #ff4d4d;
            color: #fff;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .form-section .card .submit-btn:hover {
            background-color: #e60000;
        }
        .form-section .card .icon-input {
            display: flex;
            align-items: center;
        }
        .form-section .card .icon-input i {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <br><br>
        <div class="header">
            <i class="fas fa-home"></i>
            <h1>Franchisee</h1>
            <div class="breadcrumb">
                <a href="#">Dashboard</a> &gt; <a href="#">Franchisee</a>
            </div>
        </div>
        <br><br>
        <div class="form-section">
            <div class="card">
                <h2>Personal Details</h2>
                <input type="text" id="firstname" placeholder="Firstname" required>
                <input type="text" id="lastname" placeholder="Lastname" required>
                <input type="email" id="email" placeholder="Email ID" required>
                <input type="text" id="phone" placeholder="Phone No" required>
            </div>
            <div class="card">
                <h2>Area Information</h2>
                <div class="icon-input">
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="icon-input">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter Password *" required>
                </div>
                <select id="state" required>
                    <option>-- Select State --</option>
                    <option>Andhra Pradesh</option>
                    <option>Arunachal Pradesh</option>
                    <option>Assam</option>
                    <!-- Add other states as necessary -->
                </select>
                <select id="city" required>
                    <option>-- Select City --</option>
                    <option>Agra</option>
                    <option>Ahmedabad</option>
                    <option>Allahabad</option>
                    <!-- Add other cities as necessary -->
                </select>
                <select id="district" required>
                    <option>-- Select District --</option>
                    <!-- Add district options -->
                </select>
                <select id="postOffice" required>
                    <option>-- Select Post Office --</option>
                    <!-- Add post office options -->
                </select>
                <div class="icon-input">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" id="pincode" placeholder="Enter Pincode" required>
                </div>
                <input type="text" id="address" placeholder="Enter Address" required>
            </div>
            <div class="card">
                <h2>Submission</h2>
                <input type="date" id="submissionDate" value="2024-09-08" required>
                <button class="submit-btn" id="submitBtn"><i class="fas fa-paper-plane"></i> Submit</button>
            </div>
        </div>
    </div>
    
    <script src="Add_franchisse.js"></script>
</body>
</html>
