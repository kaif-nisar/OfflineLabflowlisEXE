<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --accent-color: #3b82f6;
            --text-color: #1f2937;
            --light-gray: #f3f4f6;
            --medium-gray: #e5e7eb;
            --dark-gray: #6b7280;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        .container-cart {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-cart {
            padding: 20px 0;
            border-bottom: 1px solid var(--medium-gray);
            margin-bottom: 30px;
        }

        .header-cart h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        /* Cart Items */
        .cart-items {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 0;
        }

        .empty-cart i {
            font-size: 3rem;
            color: var(--dark-gray);
            margin-bottom: 20px;
        }

        .empty-cart h2 {
            margin-bottom: 15px;
        }

        .empty-cart p {
            color: var(--dark-gray);
            margin-bottom: 20px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 100px 2fr 1fr 1fr;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid var(--medium-gray);
            align-items: center;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-img {
            width: 100px;
            height: 100px;
            border-radius: 6px;
            overflow: hidden;
        }

        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-info {
            padding-right: 20px;
        }

        .cart-item-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cart-item-brand {
            color: var(--dark-gray);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .cart-item-price {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .cart-item-remove {
            color: var(--danger-color);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: var(--light-gray);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quantity-btn:hover {
            background-color: var(--medium-gray);
        }

        .quantity-input {
            width: 50px;
            text-align: center;
            font-size: 1rem;
            border: 1px solid var(--medium-gray);
            border-radius: 4px;
            padding: 5px;
        }

        .cart-item-total {
            text-align: right;
            font-weight: 600;
        }

        .cart-item-total-price {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        /* Cart Summary */
        .cart-summary {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .summary-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--medium-gray);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .summary-label {
            color: var(--dark-gray);
        }

        .summary-value {
            font-weight: 500;
        }

        .summary-total {
            font-weight: 700;
            font-size: 1.2rem;
            margin: 20px 0;
            padding-top: 15px;
            border-top: 1px solid var(--medium-gray);
        }

        .btn {
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
        }

        .btn-outline {
            background-color: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            width: 100%;
        }

        .btn-outline:hover {
            background-color: var(--light-gray);
        }

        .continue-shopping {
            display: inline-block;
            margin-top: 20px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .cart-container {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .cart-item {
                grid-template-columns: 80px 1fr;
                grid-template-rows: auto auto auto;
            }

            .cart-item-price-info {
                grid-column: 2;
                grid-row: 2;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .cart-item-total {
                grid-column: 1 / -1;
                grid-row: 3;
                text-align: left;
                display: flex;
                justify-content: space-between;
                margin-top: 10px;
                padding-top: 10px;
                border-top: 1px dashed var(--medium-gray);
            }
        }

        @media (max-width: 480px) {
            .cart-item-img {
                width: 60px;
                height: 60px;
            }

            .header-cart h1 {
                font-size: 1.5rem;
            }

            .quantity-input {
                width: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container-cart">
    <div class="header-cart">
        <h1><i class="fas fa-shopping-cart"></i> Your Cart</h1>
    </div>

    <div class="cart-container">
        <!-- Cart Items (Will be inserted by JS) -->
        <div class="cart-items" id="cartItems"></div>

        <!-- Cart Summary -->
        <div class="cart-summary">
            <h3 class="summary-title">Order Summary</h3>

            <div class="summary-row">
                <span class="summary-label">Subtotal (0 items)</span>
                <span class="summary-value" id="subtotal">₹0.00</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Shipping</span>
                <span class="summary-value">Free</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Tax</span>
                <span class="summary-value" id="tax">₹0.00</span>
            </div>

            <div class="summary-row summary-total">
                <span>Total</span>
                <span id="total">₹0.00</span>
            </div>

            <button class="btn btn-primary" id="checkoutBtn">
                <i class="fas fa-lock"></i> Proceed to Checkout
            </button>
        </div>
    </div>
</div>

</body>
</html>
