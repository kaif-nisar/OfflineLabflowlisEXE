<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation | ShopNow</title>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #10b981;
            --text-color: #1f2937;
            --light-gray: #f3f4f6;
            --medium-gray: #e5e7eb;
            --dark-gray: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            background-color: #f9fafb;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .confirmation-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            padding: 40px;
            text-align: center;
        }

        .success-icon {
            color: var(--success-color);
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .confirmation-title {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .confirmation-subtitle {
            color: var(--dark-gray);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .order-details {
            background-color: var(--light-gray);
            border-radius: 8px;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .detail-label {
            color: var(--dark-gray);
            font-weight: 500;
        }

        .detail-value {
            font-weight: 600;
        }

        .order-id {
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .delivery-estimate {
            margin: 25px 0;
            padding: 15px;
            background-color: #e0f2fe;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .delivery-icon {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .delivery-text {
            text-align: left;
        }

        .delivery-text strong {
            color: var(--primary-color);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
        }

        .continue-shopping {
            display: block;
            margin-top: 30px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .confirmation-card {
                padding: 30px 20px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .confirmation-title {
                font-size: 1.5rem;
            }

            .detail-row {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="confirmation-card">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h1 class="confirmation-title">Order Confirmed!</h1>
            <p class="confirmation-subtitle">Thank you for your purchase. Your order has been received.</p>

            <div class="order-details" id="productDetailsContainer">
                <div class="detail-row">
                    <span class="detail-label">Order Number:</span>
                    <span class="detail-value order-id">#...</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Date:</span>
                    <span class="detail-value">--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Total:</span>
                    <span class="detail-value">₹--</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Payment Method:</span>
                    <span class="detail-value">Wallet</span>
                </div>
            </div>


            <div class="delivery-estimate">
                <div class="delivery-icon">
                    <i class="fas fa-truck"></i>
                </div>
                <div class="delivery-text">
                    <p>Expected delivery: <strong>Standard Shipping (3-5 business days)</strong></p>
                    <p>Order status has been changed when your order shipped</p>
                </div>
            </div>

            <div class="action-buttons">
                <!-- Removed Track Order and View Order Details buttons -->
            </div>

            <a class="continue-shopping">
                <i class="fas fa-arrow-left"></i> Continue Shopping
            </a>
        </div>
    </div>
</body>

</html>
