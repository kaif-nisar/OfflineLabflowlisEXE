<html>

<head>
    <title>Hold & clinical List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f7ff;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            margin: 0 auto;
            padding: 20px;
        }

        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .breadcrumb a {
            color: #666;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb i {
            margin-right: 5px;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th,
        td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #ffeb99;
            color: #333;
        }

        td {
            background-color: #fff;
            color: #333;
        }

        .no-report {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .byfranchiseediv {
             display: flex;
            justify-content: end;
        }

        .byadmindiv {
            display: flex;
            justify-content: start;
        }

        .byfranchisee {
            padding: 2px 4px;
            max-width: fit-content;

            border-radius: 4px;
            background-color: greenyellow;
            margin: 2px;
        }

        .byadmin {
            padding: 2px 4px;
            max-width: fit-content;
            border-radius: 4px;
            text-align: left;
            background-color: rgb(199, 199, 199);
            margin: 2px;
        }

        .messageBox {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .messageBox textarea {
            padding: 2px;
        }
    </style>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
</head>

<body>
    <div class="container">
        <h1>Hold & clinical List</h1>
        <div class="breadcrumb">
            <a href="#"><i class="fas fa-home"></i></a> &gt;
            <a href="#">Dashboard</a> &gt;
            <span>Hold & clinical</span>
        </div>
        <br><br>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Booking ID</th>
                    <th>Name</th>
                    <th>Hold Reason</th>
                    <th>Price</th>
                    <th>status</th>
                </tr>
            </thead>
            <tbody id="holdbookingsBody">
                <tr>
                    <td colspan="6" class="no-report">No Reports</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
