<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add New Expense</title>
    <link rel="stylesheet" href="/css/tailwind-offline.css">
</head>

<body>
    <div class="bg-white text-gray-900 min-h-screen flex items-start justify-center py-10 px-4">
        <main class="w-full max-w-lg">
            <h1 class="text-2xl font-semibold mb-6 border-b border-gray-300 pb-2">Add new expense</h1>
            <form class="space-y-5" id="expenseForm" autocomplete="off" novalidate>
                <div>
                    <label for="name" class="block font-bold mb-1">* Name</label>
                    <input type="text" id="name" name="name"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-blue-500"
                        required />
                </div>
                <div>
                    <label for="expenseDate" class="block font-bold mb-1">* Date</label>
                    <input type="date" id="expenseDate" name="date"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-blue-500"
                        required />

                </div>
                <div>
                    <label for="amount" class="block font-bold mb-1">* Amount</label>
                    <input type="number" id="amount" name="amount" min="0" step="10"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-blue-500"
                        required />
                </div>
                <div>
                    <label for="mode" class="block font-semibold mb-1">Mode</label>
                    <select id="mode" name="mode"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-blue-500">
                        <option>Cash</option>
                        <option>Credit</option>
                        <option>Debit</option>
                        <option>Online</option>
                    </select>
                </div>
                <div>
                    <label for="category" class="block font-bold mb-1">* Expense category</label>
                    <select id="category" name="category"
                        class="w-full border border-blue-400 focus:border-blue-400 focus:ring-1 focus:ring-blue-400 rounded-md px-3 py-2"
                        required>
                        <option>FOOD</option>
                        <option>Transportation</option>
                        <option>Utilities</option>
                    </select>
                    <button type="button" id="addNewCategoryBtn"
                        class="mt-1 text-sm text-blue-600 hover:text-blue-800 focus:outline-none flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                        Add new
                    </button>
                </div>

                <!-- Hidden new category form -->
                <div id="newCategoryForm"
                    class="hidden border border-gray-300 rounded-md p-4 space-y-4 bg-gray-50 mt-4">
                    <h2 class="font-semibold text-lg mb-2">Add New Category</h2>
                    <div>
                        <label for="newCategoryName" class="block font-bold mb-1">* Name</label>
                        <input type="text" id="newCategoryName" name="newCategoryName"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-blue-500" />
                    </div>
                    <div>
                        <label for="newCategoryDescription" class="block font-bold mb-1">* Budget</label>
                        <input type="text" id="newCategoryDescription" name="newCategoryDescription"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-blue-500" />
                    </div>
                    <div class="flex gap-3 justify-end">
                        <button type="button" id="cancelNewCategory"
                            class="border border-gray-300 rounded-md px-4 py-2 text-gray-700 hover:bg-gray-200 focus:outline-none">Cancel</button>
                        <button type="button" id="saveNewCategory"
                            class="bg-blue-600 text-white rounded-md px-4 py-2 hover:bg-blue-700 focus:outline-none">Save</button>
                    </div>
                </div>

                <div>
                    <label for="notes" class="block font-semibold mb-1">Notes</label>
                    <textarea id="notes" name="notes" rows="3"
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-blue-500 resize-y"></textarea>
                </div>

                <div class="flex gap-4">
                    <button type="submit"
                        class="bg-blue-600 text-white rounded-md px-6 py-2 hover:bg-blue-700 focus:outline-none">Save</button>
                    <button type="button" id="cancelBtn"
                        class="border border-gray-300 rounded-md px-6 py-2 text-gray-700 hover:bg-gray-200 focus:outline-none">Cancel</button>
                </div>
            </form>
        </main>
    </div>
</body>

</html>
